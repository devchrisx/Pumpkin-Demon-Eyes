; Pumpkin Demon Eyes  -  Seeed Studio XIAO ESP32-C3 + 2x GC9A01 (240x240)
;
; Toolchain : espressif32 platform 6.x = arduino-esp32 2.0.17 (ESP-IDF 4.4)
; Libraries : LovyanGFX (GC9A01 driver, SPI + DMA, two independent panels)
;
; All tuning happens in src/Config.h - LovyanGFX needs no extra setup file,
; the panels are configured in code (DisplayManager.cpp).
;
; Upload    : USB-C (native USB-Serial/JTAG). If the port does not show up,
;             hold BOOT, tap RESET, release BOOT and upload again.

[env:xiao_esp32c3]
platform          = espressif32@^6.12.0
board             = seeed_xiao_esp32c3
framework         = arduino

lib_deps          =
    lovyan03/LovyanGFX@^1.2.35

; The renderer is CPU bound: optimise for speed instead of size
build_unflags     = -Os
build_flags       =
    -O2
    -D CORE_DEBUG_LEVEL=0

monitor_speed     = 115200
monitor_filters   = esp32_exception_decoder
upload_speed      = 921600
